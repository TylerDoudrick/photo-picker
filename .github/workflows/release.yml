name: Build & Release TV APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Debug Keystore Exists
        run: |
          if [ -f "debug.keystore.base64" ] && [ -s "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64 file..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore via keytool..."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la debug.keystore

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Sign APK with v1 and v2 Schemes
        run: |
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS_DIR"
          "$BUILD_TOOLS_DIR/apksigner" sign --ks debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            app/build/outputs/apk/debug/app-debug.apk
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare Release Assets & Version
        id: prep
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | head -n1 | awk -F'"' '{print $2}')
          VERSION_CODE=$(grep "versionCode =" app/build.gradle.kts | head -n1 | awk -F'=' '{print $2}' | tr -d ' ')
          
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0"
          fi
          
          TAG="v${VERSION_NAME}.${{ github.run_number }}"
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV

          # Prepare named APKs for release download
          cp app/build/outputs/apk/debug/app-debug.apk "tv-backdrop-photos-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "tv-backdrop-photos-latest.apk"

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-backdrop-photos-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "TV Backdrop Photos ${{ env.TAG }}"
          draft: false
          prerelease: false
          files: |
            tv-backdrop-photos-${{ env.TAG }}.apk
            tv-backdrop-photos-latest.apk
          body: |
            ## TV Backdrop Photos Release (${{ env.TAG }})

            Automated release triggered by push to `main`.

            ### Release Details
            - **App Name**: TV Backdrop Photos
            - **Version Name**: `${{ env.VERSION_NAME }}`
            - **Version Code**: `${{ env.VERSION_CODE }}`
            - **Commit**: `${{ github.sha }}`

            ### Important Installation Note for Google TV
            - **Download from Releases**: Always download **`tv-backdrop-photos-latest.apk`** from the **Assets** section below (do NOT download from GitHub Actions 'Artifacts' summary, as GitHub wraps artifacts into a `.zip` archive which causes "There was a problem parsing the package").
            - **Install**:
              - Via ADB: `adb connect <TV-IP>:5555 && adb install -r tv-backdrop-photos-latest.apk`
              - Or send the raw `.apk` file to your TV using the **Send Files to TV** app.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
