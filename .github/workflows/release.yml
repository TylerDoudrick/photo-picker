name: Build & Release TV APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Release Assets & Version
        id: prep
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | head -n1 | awk -F'"' '{print $2}')
          VERSION_CODE=$(grep "versionCode =" app/build.gradle.kts | head -n1 | awk -F'=' '{print $2}' | tr -d ' ')
          
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0"
          fi
          
          TAG="v${VERSION_NAME}.${{ github.run_number }}"
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV

          # Prepare named APKs for release download
          cp app/build/outputs/apk/debug/app-debug.apk "tv-backdrop-photos-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "tv-backdrop-photos-latest.apk"

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-backdrop-photos-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "TV Backdrop Photos ${{ env.TAG }}"
          draft: false
          prerelease: false
          files: |
            tv-backdrop-photos-${{ env.TAG }}.apk
            tv-backdrop-photos-latest.apk
          body: |
            ## TV Backdrop Photos Release (${{ env.TAG }})

            Automated release triggered by push to `main`.

            ### Release Details
            - **App Name**: TV Backdrop Photos
            - **Version Name**: `${{ env.VERSION_NAME }}`
            - **Version Code**: `${{ env.VERSION_CODE }}`
            - **Commit**: `${{ github.sha }}`

            ### How to Install on Google TV / Android TV
            1. Download **`tv-backdrop-photos-latest.apk`** below.
            2. Install via wireless ADB (`adb connect <TV-IP>:5555 && adb install -r tv-backdrop-photos-latest.apk`) or via **Send Files to TV** app.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
